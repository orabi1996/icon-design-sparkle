name: Business quality

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/business-quality.yml"

permissions:
  contents: read

jobs:
  business-tests:
    name: Business rules and navigation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run dependency-free business tests
        run: npm test

  typecheck:
    name: TypeScript contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check:types

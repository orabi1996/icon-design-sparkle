name: Business quality

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/business-quality.yml"

permissions:
  contents: read

jobs:
  business-tests:
    name: Business rules and navigation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # The pre-existing lock omits optional Tailwind @emnapi peers; npm install repairs the runner lock without committing it.
        run: npm install --no-audit --no-fund
      - name: Run dependency-free business tests
        run: npm test

  typecheck:
    name: TypeScript contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # The pre-existing lock omits optional Tailwind @emnapi peers; npm install repairs the runner lock without committing it.
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run check:types

  build:
    name: Application build
    needs: [business-tests, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_COMPANY_BUSINESS_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # Keep the same temporary lock repair used by the validation jobs.
        run: npm install --no-audit --no-fund
      - name: Build application
        run: npm run build
